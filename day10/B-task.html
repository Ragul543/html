<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <!-- <div class="form-group"> -->
        <h1>Student Information</h1>
        
        <label for="fn" class="fw-semibold text-primary form-label">First name </label>
        
        <input type="text" class="form-control form-control-lg " placeholder="Firstname (lg-Size)" id="fn">
        <div class="mb-3"></div>

        <label for="ln" class="fw-bold text-primary">Second name</label> 
        <div class="mb-3"></div>
        <input type="text" class="form-control form-control-sm " placeholder="Secondname (sm-Size)" id="ln">
        <div class="mb-3"></div>

      <label for="ph" class="form-label text-danger fw-semibold">Phone Number</label>
        <input type="number" class="form-control" id="ph" placeholder="(default-Size)">
        <div class="mb-3"></div>

        <label for="pic" class="form-label text-success fw-semibold ">Upload your picture</label>
        <input type="file" class="form-control">
        <div class="form-text">Upload picture should be under 5MB</div>
        <div class="mb-4"></div>

      
        <label for="emaill">Email</label>
        
        <input type="email">
       


    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
